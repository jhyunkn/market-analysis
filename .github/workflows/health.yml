name: Data health check

# After every full refresh, and twice a day on weekdays as a backstop, check that the published data is on the
# latest completed session. If not, open (or update) one GitHub issue so the owner is notified; close it when the
# data is current again. The page also shows a warning from data/health.json.
on:
  workflow_run:
    workflows: ["Refresh market analysis data"]
    types: [completed]
  schedule:
    - cron: "40 23 * * 1-5"   # about 6:40 PM ET (EST) / 7:40 PM ET (EDT)
    - cron: "10 14 * * 1-5"   # about 9:10 AM ET (EST) / 10:10 AM ET (EDT)
  workflow_dispatch:
    inputs:
      drill:
        description: "Alert drill: pretend the data is stale, open the alert issue, then close it"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: market-analysis-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the published data against the latest session
        id: health
        continue-on-error: true
        run: |
          if [ "${{ inputs.drill }}" = "true" ]; then echo "ALERT DRILL: simulated stale data (nothing is actually wrong)" | tee "$RUNNER_TEMP/health.txt"; exit 1; fi
          python scripts/health_check.py | tee "$RUNNER_TEMP/health.txt"; exit ${PIPESTATUS[0]}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Load the published page in a browser and check it works
        id: page
        continue-on-error: true
        run: |
          sleep 90   # let GitHub Pages finish publishing the refresh that triggered this run
          npm i --no-save --no-audit --no-fund playwright@1.64.1 axe-core@4.10.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node scripts/page_test.mjs | tee "$RUNNER_TEMP/page.txt"; exit ${PIPESTATUS[0]}
      - name: Publish the health state when it changes
        if: ${{ inputs.drill != true }}
        run: |
          state() { python3 -c "import json,sys; r=json.load(open(sys.argv[1]))['rows'][0]; print(r['ok'], r['problems'], r.get('expected_session'), (r.get('checked_at') or '')[:10])" "$1"; }
          git show HEAD:data/health.json > "$RUNNER_TEMP/prev.json" 2>/dev/null || echo '{"rows":[{"ok":null,"problems":[]}]}' > "$RUNNER_TEMP/prev.json"
          if [ "$(state data/health.json)" = "$(state "$RUNNER_TEMP/prev.json")" ]; then
            echo "Health state unchanged; nothing to publish."
            git checkout -- data/health.json 2>/dev/null || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json
          git commit -m "Data health: $(python3 -c "import json; r=json.load(open('data/health.json'))['rows'][0]; print('current' if r['ok'] else str(len(r['problems'])) + ' stale')")"
          for attempt in 1 2 3; do git pull --rebase -X theirs origin main && git push origin main && break; sleep 5; done
      - name: Open, update or close the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-health --color B4473B --description "Published data is out of date" 2>/dev/null || true
          open=$(gh api "repos/${{ github.repository }}/issues?labels=data-health&state=open" --jq '.[0].number // empty')
          if [ "${{ steps.health.outcome }}" = "failure" ] || [ "${{ steps.page.outcome }}" = "failure" ]; then
            body="$(printf 'The published dashboard has a problem.\n\n```\n%s\n%s\n```\n\nCheck run: %s\n\nThis issue closes itself when the data is current and the page test passes.' "$(cat "$RUNNER_TEMP/health.txt")" "$(cat "$RUNNER_TEMP/page.txt" 2>/dev/null)" "$RUN_URL")"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Market dashboard: data out of date or page broken" --label data-health --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Data is current again ($RUN_URL)." && gh issue close "$open"
          fi
      - name: End the drill
        if: ${{ inputs.drill == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          n=$(gh api "repos/${{ github.repository }}/issues?labels=data-health&state=open" --jq '.[0].number // empty')
          [ -n "$n" ] && gh issue comment "$n" --body "That was an alert drill: the alert path works. Closing." && gh issue close "$n"
          [ -n "$n" ] || { echo "drill failed: no alert issue was opened"; exit 1; }
