name: Refresh market analysis data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force_flows:
        description: Rebuild insider, fund and short-interest data even if it is less than 20 hours old
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-analysis-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh analyst consensus (Nasdaq)
        continue-on-error: true
        run: python scripts/refresh_analysts.py
      - name: Build market-only datasets
        run: python scripts/build_data.py
      - name: Validate generated datasets
        run: python scripts/validate_data.py
      - name: Build macro regime read
        continue-on-error: true
        run: python scripts/macro_regime.py
      - name: Build market-against-history tables
        continue-on-error: true
        run: python scripts/market_history.py
      - name: Build insider, fund and short-interest flows (daily)
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_flows.py ${{ inputs.force_flows && '--force' || '' }}
      - name: Validate macro, history and flows (restores any that fail)
        continue-on-error: true
        run: python scripts/validate_extra.py
      - name: Build and validate news, drivers and macro
        id: drivers
        continue-on-error: true
        run: |
          cp data/drivers.json "$RUNNER_TEMP/drivers.previous.json"
          python scripts/build_drivers.py
          python scripts/validate_drivers.py || { cp "$RUNNER_TEMP/drivers.previous.json" data/drivers.json; exit 1; }
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/analyst_targets.json data/outlook_summary.json data/outlook_cone.json data/outlook_history.json data/news.json data/market.json data/drivers.json data/macro_regime.json data/market_history.json data/flows.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Refresh market analysis data"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Report stale news, drivers and macro
        if: steps.drivers.outcome == 'failure'
        run: |
          echo "::error::News, drivers and macro were not refreshed. Prices were still published, and the page marks this section out of date once it is over 8 hours old."
          exit 1
