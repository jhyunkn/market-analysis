name: Refresh market analysis data

on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths: ["triggers/refresh"]   # written by the scheduled Claude routine; GitHub's own cron is unreliable
  workflow_dispatch:
    inputs:
      force_flows:
        description: Rebuild insider, fund and short-interest data even if it is less than 20 hours old
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-analysis-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh analyst consensus (Nasdaq)
        continue-on-error: true
        run: python scripts/refresh_analysts.py
      - name: Build market-only datasets
        run: python scripts/build_data.py
      - name: Validate generated datasets
        run: python scripts/validate_data.py
      - name: Build macro regime read
        continue-on-error: true
        run: python scripts/macro_regime.py
      - name: Build market-against-history tables
        continue-on-error: true
        run: python scripts/market_history.py
      - name: Build insider, fund and short-interest flows (daily)
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_flows.py ${{ inputs.force_flows && '--force' || '' }}
      - name: Build yield curve, fear gauges and Fed calendar
        continue-on-error: true
        run: python scripts/build_cross_asset.py
      - name: S&P 500 breadth, sectors, momentum and factors
        continue-on-error: true
        run: python scripts/build_breadth.py
      - name: Futures and after-hours prices
        continue-on-error: true
        run: python scripts/build_live.py
      - name: Looking ahead (option-implied ranges, trend rule, recession odds, scorecard)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/build_forward.py
      - name: Strategy lab (tested rules, holdings, live record)
        continue-on-error: true
        run: python scripts/build_strategies.py
      - name: Ten-year view from valuation (Shiller CAPE, walk-forward tested)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/build_valuation.py
      - name: Century view (150 years of cycles, bear markets, analog months, walk-forward graded)
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/build_cycles.py
      - name: Stock ratings (long-term and short-term checks, weekly live log)
        continue-on-error: true
        timeout-minutes: 12
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/build_ratings.py
      - name: Ratings history test from SEC filings (weekly)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/backtest_ratings.py
      - name: Validate macro, history and flows (restores any that fail)
        continue-on-error: true
        run: python scripts/validate_extra.py
      - name: Build and validate news, drivers and macro
        id: drivers
        continue-on-error: true
        run: |
          cp data/drivers.json "$RUNNER_TEMP/drivers.previous.json"
          python scripts/build_drivers.py
          python scripts/validate_drivers.py || { cp "$RUNNER_TEMP/drivers.previous.json" data/drivers.json; exit 1; }
      - name: Record news themes for the narrative timeline
        continue-on-error: true
        run: python scripts/record_narrative.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/analyst_targets.json data/outlook_summary.json data/outlook_cone.json data/outlook_history.json data/news.json data/market.json data/drivers.json data/macro_regime.json data/market_history.json data/flows.json data/cross_asset.json data/live.json data/breadth.json config/sp500.json data/narrative.json data/forward.json data/forecast_log.json data/strategies.json data/valuation.json data/cycles.json data/decisions.ics data/ratings.json data/ratings_log.json data/ratings_backtest.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Refresh market analysis data"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && break
              sleep 5
            done
          fi
      - name: Report stale news, drivers and macro
        if: steps.drivers.outcome == 'failure'
        run: |
          echo "::error::News, drivers and macro were not refreshed. Prices were still published, and the page marks this section out of date once it is over 8 hours old."
          exit 1
