name: Refresh market analysis data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-analysis-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build market-only datasets
        run: python scripts/build_data.py
      - name: Validate generated datasets
        run: python scripts/validate_data.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outlook_summary.json data/outlook_cone.json data/outlook_history.json data/news.json data/market.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Refresh market analysis data"
            git pull --rebase origin main
            git push origin main
          fi
